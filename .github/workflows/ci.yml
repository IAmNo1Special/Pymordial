name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.13"
      install-command: "uv sync --dev"
      run-tests: false
      lint-commands: |
        uv run black --check src/ tests/
        uv run isort --check-only src/ tests/

  test:
    needs: lint
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.13"
      runs-on: windows-latest
      install-command: "uv sync --all-extras --dev"
      run-lint: false
      test-commands: "uv run pytest tests/ -v -m \"not integration\""
